name: Update YouTube links

on:
  schedule:
    # 09:30 UTC is just after the YouTube quota resets at midnight Pacific time.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect YouTube links
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DAILY_SEARCHES: "95"
        run: node scripts/youtube_links.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data charts
          if git diff --cached --quiet; then
            echo "No link changes"
          else
            git commit -m "chore: update YouTube links"
            git push
          fi
